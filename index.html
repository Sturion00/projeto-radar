<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Susanoo</title>
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=MedievalSharp&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/f09649e5fc.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Susanoo </h1>
        <nav class="navegador">
            <a target="_blank" href="https://www.simepar.br">Simepar</a>
            <a target="_blank" href="https://www.ipmetradar.com.br/2mobileGis.php">Ipmet</a>
            <a target="_blank" href="https://www.ventusky.com">VentuSky</a>
            <a target="_blank" href="https://www.windy.com/?-23.538,-51.903,5">Windy</a>
        </nav>
    </header>
    <article class="card-principal">
        <div class="barra-procura">
            <form>
                <input type="search" name="txtproc" placeholder="Marialva" id="txtproc">
                <input type="button" value="Buscar" id="btn-proc" onclick="procurar()">
            </form>
        </div>
        <div class="previsao-principal">
            <div class="icon-prev" id="info-principal">
                <p id="icon">
                    <img id="img" src="https://openweathermap.org/payload/api/media/file/10d@2x.png" alt="">
                </p>
                <p id="desc">[--DESC--]</p>
            </div>
            <div class="resumo-principal" id="info-principal">
                <p id="temp">[--TEMP--]</p>
                <p id="humid">[--HUMID--]</p>
            </div>
        </div>
        <div class="previsao-secundaria">
            <div id="info-secundaria">
                Previsão: <p>[15º]</p>
            </div>
            <div id="info-secundaria">
                Previsão: <p>[15º]</p>
            </div>
            <div id="info-secundaria">
                Previsão: <p>[15º]</p>
            </div>
            <div id="info-secundaria">
                Previsão: <p>[15º]</p>
            </div>
            <div id="info-secundaria">
                Previsão: <p>[15º]</p>
            </div>
            <div id="info-secundaria">
                Previsão: <p>[15º]</p>
            </div>
        </div>
        <p class="api-info">Dados fornecidos por <a target="_blank" href="https://openweathermap.org">OpenWeather</a></p>
    </article>
    <footer class="rodape">
        <p>Desenvolvido por <a target="_blank" href="https://github.com/Sturion00">Sturion00</a></p>
    </footer>

    <script src="script/script.js"></script>

</body>
</html>
